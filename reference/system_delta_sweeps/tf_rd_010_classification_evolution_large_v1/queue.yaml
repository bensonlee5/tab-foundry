schema: tab-foundry-system-delta-sweep-queue-v1
sweep_id: tf_rd_010_classification_evolution_large_v1
rows:
- order: 1
  delta_ref: delta_data_manifest_root_tf_rd_010_dagzoo_medium_control
  status: ready
  rationale: Establish the TF-RD-010 classification control front before reading any
    missingness harder-front effect on the larger benchmark rung.
  hypothesis: The evolved sandwich family should first be judged on the TF-RD-010
    control corpus (`n_classes_min=2`) against the larger hub validation manifest.
  anchor_delta: Use the evolved FiLM plus 3-summary-token sandwich contract and train
    on `tf_rd_010_dagzoo_medium_control_v1` while validating on the hub-owned large
    classification manifest.
  model:
    arch: tabfoundry_sandwich
    d_icl: 60
    input_normalization: train_zscore_clip
    many_class_base: 10
    head_hidden_dim: 96
    sandwich_latents: 24
    sandwich_layers: 2
    sandwich_heads: 4
    sandwich_ff_expansion: 2
    sandwich_summary_tokens_per_axis: 3
    sandwich_self_attention_per_cross: 4
    sandwich_pre_row_attention_layers: 1
    sandwich_pre_column_attention_layers: 1
    feature_type_conditioning: film
  data:
    surface_label: tf_rd_010_dagzoo_medium_control
    source: manifest
    corpus_ref: tf_rd_010_dagzoo_medium_control_v1
    train_row_cap: 64
    test_row_cap: 32
  preprocessing:
    surface_label: runtime_default
  training:
    surface_label: prior_cosine_warmup
    task_batch_size: 1
    overrides:
      runtime:
        max_steps: 400
      schedule:
        stages:
        - name: prior_dump
          steps: 400
          lr_max: 0.004
          lr_schedule: cosine
          warmup_ratio: 0.05
  parameter_adequacy_plan:
  - Confirm `tab-realdata-hub#1` has materialized the large classification manifest
    from `openml_classification_large_v1.json` before execution.
  - Freeze the legacy `cls_benchmark_linear_multiclass_large_v1` control baseline
    before treating any row outcome as a promotion or defer decision.
  - Rank by `final_bpc_at_matched_regime_budget`, then inspect raw log loss, calibration,
    runtime, and stability as guardrails.
  next_action: Rerun this row after issues `#204` and `#205` land, then use it as
    the trusted large anchor for the remaining large-rung comparisons under issue
    `#203`.
  notes:
  - '`dagzoo` owns this synthetic training front; `tab-realdata-hub` owns the validation
    manifest.'
  - This row remains the intended TF-RD-010 large reference for missingness transfer
    and class-imbalance reporting on the large validation pool.
  - Historical 400-step TF-RD-010 executions are invalidated and retained only as
    non-canonical artifacts.
  - Trusted rerun work now flows through issues `#202`, `#203`, and `#204`.
  run_id: null
  followup_run_ids: []
  decision: null
  interpretation_status: pending
  confounders: []
