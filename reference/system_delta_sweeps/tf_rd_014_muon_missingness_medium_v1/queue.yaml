        muon_lr_scale_base: 0.2
        muon_partition_non2d: true
      runtime:
        mixed_precision: bf16
        grad_clip: 0.0
        grad_accum_steps: 4
        trace_activations: false
        activation_checkpointing: true
        eval_every: 25
        checkpoint_every: 25
        val_batches: 0
        max_steps: 2500
        loader_task_batch_cache: false
