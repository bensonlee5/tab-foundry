schema: tab-foundry-system-delta-sweep-queue-v1
sweep_id: tf_rd_013_dagzoo_size_ladder_v1
rows:
- order: 1
  delta_ref: delta_training_current_corpus_uncapped
  status: ready
  rationale: Re-establish the settled row-first anchor on a fresh current-corpus recipe generated from the current dagzoo default config, then clear the inherited 330-second cap so the remaining TF-RD-013 rows compare against one current same-backend control.
  hypothesis: A fresh current-corpus recipe plus cleared `target_train_seconds` should produce the canonical control for the dagzoo size ladder under the current manifest-backed training path.
  anchor_delta: Keep the settled row-first model and preprocessing surfaces fixed, point data at the fresh current-corpus corpus recipe generated from the current dagzoo default config, and clear the inherited time cap so the manifest trainer stops only at `max_steps=2500`.
  model:
    stage: qass_context
    stage_label: delta_qass_no_column_v3
    module_overrides:
      column_encoder: none
  data:
    surface_label: anchor_manifest_default
    corpus_ref: tf_rd_013_current_corpus_default_v1
  preprocessing:
    surface_label: runtime_default
  training:
    surface_label: prior_linear_warmup_decay
    prior_dump_non_finite_policy: skip
    overrides:
      apply_schedule: true
      runtime:
        max_steps: 2500
        target_train_seconds: null
        eval_every: 25
        checkpoint_every: 25
        trace_activations: false
        val_batches: 0
      optimizer:
        name: schedulefree_adamw
        require_requested: true
        weight_decay: 0.0
        betas:
        - 0.9
        - 0.999
        min_lr: 0.0004
        muon_per_parameter_lr: false
      schedule:
        stages:
        - name: stage1
          steps: 2500
          lr_max: 0.004
          lr_schedule: linear
          warmup_ratio: 0.05
  parameter_adequacy_plan:
  - Confirm the resolved backend is `manifest`, `runtime.max_steps` is `2500`, and `runtime.target_train_seconds` is `null` before reading any benchmark outcome.
  - Use this row as the fresh current-corpus control for rows 2-4 rather than as a new training optimization claim.
  run_id: null
  followup_run_ids: []
  decision: null
  interpretation_status: pending
  confounders: []
  next_action: Run first on the CUDA machine after materializing corpus recipe `tf_rd_013_current_corpus_default_v1`.
  notes:
  - This row resolves through corpus recipe `tf_rd_013_current_corpus_default_v1` and does not reuse the stale 2026-02-22 absolute-path snapshot.
  - The historical locked anchor artifact predates the backend-aware manifest runner; this row establishes the canonical fresh current-corpus control for the remaining TF-RD-013 decision.
