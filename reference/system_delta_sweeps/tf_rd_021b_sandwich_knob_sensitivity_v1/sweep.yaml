anchor_surface:
  notes:
  - This completed sweep treats the registered compact hybrid sandwich run `tf_rd_021b_hybrid_full_cell_compact_prior_v1` as the locked local control under the broader [#178](https://github.com/bensonlee5/tab-foundry/issues/178) umbrella.
  - The control is the current small hybrid `tabfoundry_sandwich` surface: stage `0` reads full cells plus summary tokens, later stages reuse the compact summary stream, and the readout attends to latents and then raw cells.
  - Keep the prior-dump surface, `runtime_default` preprocessing, `prior_cosine_warmup` recipe, and the fixed `2500`-step budget frozen across all rows.
  - This is an architecture-only screen. The benchmark compares each row against the locked control on the pinned medium binary bundle and does not run any external comparator.
  - The purpose was to learn which sandwich-specific knobs are materially sensitive before the immediate width or head-capacity follow-up opens.
  - All eight stage-1 ablations underperformed the locked control on final log loss and final ROC AUC. The least harmful degradations came from `sandwich_self_attention_per_cross=1` (`+0.0055` delta final log loss), `sandwich_ff_expansion=1` (`+0.0096`), and `sandwich_summary_tokens_per_axis=1` (`+0.0147`).
  - Even if this screen identifies low-sensitivity knobs, do not collapse to a one-toggle scale law yet; a sandwich-local empirical power-curve phase follows the sensitivity passes before any single-toggle recipe is authored.
  dimension_table:
  - dimension: latent bank size
    upstream: Perceiver-style models use latent count as an explicit memory and fidelity knob.
    anchor: Compact hybrid control uses `sandwich_latents=24`.
    interpretation: This screen asks whether the current local control is already overprovisioned or still materially sensitive on latent-token count.
  - dimension: repeated cross-attend depth
    upstream: Perceiver stacks can trade repeated latent reads against compute.
    anchor: Compact hybrid control uses `sandwich_layers=2`.
    interpretation: If one repeated stage is enough here, later scaling should not keep repeated depth as a first-class free knob.
  - dimension: attention partitioning
    upstream: Transformer head count changes factorization without changing total width.
    anchor: Compact hybrid control uses `sandwich_heads=4`.
    interpretation: A weak ablation would argue for freezing head count rather than carrying it into a later compound scaling recipe.
  - dimension: feed-forward width
    upstream: FF expansion changes per-token capacity independently of attention routing.
    anchor: Compact hybrid control uses `sandwich_ff_expansion=2`.
    interpretation: This read separates trunk MLP capacity from the architectural gains of the hybrid full-cell path.
  - dimension: summary-stream bandwidth
    upstream: The successor widened row and column summaries from one token per axis position to `K=4`.
    anchor: Compact hybrid control uses `sandwich_summary_tokens_per_axis=4`.
    interpretation: If this ablation is weak, summary-token multiplicity is a good candidate to freeze lower before later scaling work.
  - dimension: latent self-refinement depth
    upstream: Perceiver-style models can vary how much latent self-attention happens between cross-attention reads.
    anchor: Compact hybrid control uses `sandwich_self_attention_per_cross=4`.
    interpretation: This read tests whether most of the gain comes from repeated latent refinement or from the stage-`0` and readout structural bypasses.
  - dimension: pre-Perceiver row mixer
    upstream: The successor adds per-row feature self-attention before the first latent read.
    anchor: Compact hybrid control uses `sandwich_pre_row_attention_layers=1`.
    interpretation: This isolates whether row-wise feature mixing is materially useful before the latent bottleneck.
  - dimension: pre-Perceiver column mixer
    upstream: The successor also adds per-column row self-attention before the first latent read.
    anchor: Compact hybrid control uses `sandwich_pre_column_attention_layers=1`.
    interpretation: This isolates whether the second axial pre-mixer is carrying signal or just extra compute.
  - dimension: benchmark contract
    upstream: Not applicable.
    anchor: Locked medium binary bundle with no external comparator.
    interpretation: Keep the bundle and benchmark artifact path fixed so the screen is about architecture sensitivity, not about benchmark-surface movement.
  - dimension: training surface
    upstream: No repo-local prior recipe is fixed by PerceiverIO.
    anchor: Training surface label `prior_cosine_warmup` on the legacy prior backend.
    interpretation: Keep the training recipe fixed so this screen reads sandwich-specific knobs rather than optimizer or budget adequacy.
