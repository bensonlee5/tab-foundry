anchor_surface:
  notes:
  - This sweep opens TF-RD-018 issue `#137` by replaying the settled schedulefree
    baseline on the documented harder carry-forward surface `tf_rd_020_shift_noise_drift_v1`
    before comparing `adamw` and `muon`.
  - Keep the settled row-first model, preprocessing surface, benchmark bundle, and
    `task_batch_size=4` runtime fixed; only the carried harder data surface and optimizer
    family are in scope here.
  - The locked anchor remains benchmark registry run `sd_row_first_training_adequacy_v1_01_delta_training_task_batch4_v1`
    on the medium control surface; row `01` is a replayed schedulefree carry on `tf_rd_020_shift_noise_drift_v1`,
    not the original TF-RD-020 `400`-step executed row.
  - Promote row `01` after execution, then compare rows `02` and `03` against that
    promoted harder-surface replay rather than against the medium-surface anchor alone.
  - '`tf_rd_020_noise_mixture_v1` remains the named fallback harder surface, but it
    is intentionally outside `tf_rd_018_optimizer_family_v1`.'
  dimension_table:
  - dimension: promoted anchor
    upstream: TabICLv2 motivates synthetic pretraining but does not define this repo-local
      row-first promoted-anchor contract.
    anchor: The kept `row_cls + qass + no tfcol` anchor trained on the settled `task_batch_size=4`
      manifest-batched surface from TF-RD-018 issue `#109`.
    interpretation: TF-RD-018 issue `#137` must keep the promoted row-first model
      surface fixed while reading optimizer-family evidence.
  - dimension: harder carry-forward surface
    upstream: No upstream reference defines this exact dagzoo harder-surface handoff.
    anchor: The locked medium-surface anchor remains `tf_rd_013_dagzoo_shape_aware_size_medium_v1`,
      while row `01` replays schedulefree on `tf_rd_020_shift_noise_drift_v1`.
    interpretation: The TF-RD-020 noise-drift winner is evidence for which data surface
      to carry forward, not the optimizer anchor itself.
  - dimension: optimizer family
    upstream: Not applicable.
    anchor: Schedulefree AdamW on the settled `2500`-step `task_batch_size=4` recipe
      is the replay baseline for this sweep.
    interpretation: Compare `schedulefree_adamw`, `adamw`, and `muon` on the same
      harder-surface recipe before reopening LR, clipping, or budget work.
  - dimension: fallback scope
    upstream: Not applicable.
    anchor: '`tf_rd_020_noise_mixture_v1` is excluded from this v1 sweep.'
    interpretation: If noise drift is too confounded, stop with an explicit defer
      note and open fallback-surface work separately rather than broadening
