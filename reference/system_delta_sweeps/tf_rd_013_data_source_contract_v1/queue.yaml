schema: tab-foundry-system-delta-sweep-queue-v1
sweep_id: tf_rd_013_data_source_contract_v1
rows:
- order: 1
  delta_ref: delta_data_manifest_root_dagzoo_generated_source
  status: ready
  rationale: Define the first canonical dagzoo candidate surface as the raw generated-source corpus so TF-RD-013 can read current-versus-dagzoo without waiting on any later filtering policy.
  hypothesis: The unfiltered dagzoo generated-source corpus may already be competitive enough for the promoted anchor, and the first comparison should establish that before the repo decides whether any later filtering is warranted.
  anchor_delta: Keep the promoted anchor model, preprocessing, and training recipe fixed, but replace the current corpus with a TF-RD-013 unfiltered dagzoo generated-source manifest that carries the canonical dagzoo provenance payload.
  model:
    stage: qass_context
    stage_label: delta_qass_no_column_v3
    module_overrides:
      column_encoder: none
  data:
    surface_label: tf_rd_013_dagzoo_generated_source
    surface_overrides:
      source: manifest
      manifest_path: outputs/staged_ladder_support/tf_rd_013/generated_source/manifest.parquet
      dagzoo_provenance:
        corpus_variant: dagzoo_generated_source
        comparator_role: promoted_anchor_candidate
        commands:
        - cd "$DAGZOO_ROOT" && uv run dagzoo generate --config configs/default.yaml --handoff-root "$TAB_FOUNDRY_ROOT/outputs/staged_ladder_support/tf_rd_013/generated_source" --num-datasets 200 --seed 1 --device cpu --hardware-policy none
        - cd "$TAB_FOUNDRY_ROOT" && ./.venv/bin/tab-foundry data build-manifest --data-root outputs/staged_ladder_support/tf_rd_013/generated_source/generated --out-manifest outputs/staged_ladder_support/tf_rd_013/generated_source/manifest.parquet
        config_refs:
        - configs/default.yaml
        curated_root_lineage: []
        materialization_issue: 120
  preprocessing:
    surface_label: runtime_default
  training:
    surface_label: prior_linear_warmup_decay
  parameter_adequacy_plan:
  - Compare manifest characteristics against the current-corpus anchor before reading any benchmark outcome.
  - Treat `filter_status_counts.not_run` as a deliberate property of the initial unfiltered sweep, not as a hidden data-contract bug.
  run_id: null
  followup_run_ids: []
  decision: null
  interpretation_status: pending
  confounders:
  - "This row intentionally measures the raw generated-source corpus before any later filtering-policy decision."
  - "Any win or weakness here may reflect the unfiltered corpus directly rather than the value of a future filtering pass."
  next_action: Run the promoted-anchor current-versus-unfiltered-dagzoo comparison and record whether the raw generated-source corpus is strong enough to justify later filtering follow-up under issue 124.
  notes:
  - "This row defines the canonical top-level `dagzoo_provenance` keys expected on TF-RD-013 promoted-anchor comparison surfaces."
  - "Reference-only support bundle: `reference/system_delta_sweeps/tf_rd_013_data_source_contract_v1/support/materialization_summary.json` and `reference/system_delta_sweeps/tf_rd_013_data_source_contract_v1/support/manifest_characteristics_summary.json`."
  - "Issue 124 is subsequent policy work on whether any filtered dagzoo variants should exist after the initial unfiltered read."

- order: 2
  delta_ref: delta_data_manifest_curated_realdata_comparator
  status: blocked_on_artifacts
  rationale: Make the curated real-data comparator contract explicit so TF-RD-013 reads unfiltered dagzoo against a defined comparator lane instead of a vague future workstream.
  hypothesis: The first comparator should stay anchored on one canonical OpenML baseline and only add approved manifest-backed external augmentations when they cover regimes OpenML misses.
  anchor_delta: Keep the promoted anchor model, preprocessing, and training recipe fixed, but define the curated real-data comparator manifest family as a separate contract surface from both the current corpus and the unfiltered dagzoo candidate.
  model:
    stage: qass_context
    stage_label: delta_qass_no_column_v3
    module_overrides:
      column_encoder: none
  data:
    surface_label: tf_rd_013_curated_realdata_comparator
    surface_overrides:
      source: manifest
      manifest_path: outputs/staged_ladder_support/tf_rd_013/curated_realdata/openml_baseline/manifest.parquet
  preprocessing:
    surface_label: runtime_default
  training:
    surface_label: prior_linear_warmup_decay
  parameter_adequacy_plan:
  - Keep the OpenML baseline canonical and cite approved external augmentations only after issue 114 license approval rows exist.
  - Interpret this row as comparator-surface contract work, not as a new ingestion pathway.
  run_id: null
  followup_run_ids: []
  decision: null
  interpretation_status: pending
  confounders:
  - The comparator surface depends on later curation and license backfill work under issues 97, 106, and 114.
  next_action: Materialize the approved OpenML-baseline comparator manifest and cite any approved manifest-backed augmentations before scheduling this comparator against the current corpus and the unfiltered dagzoo row.
  notes:
  - This row defines comparator policy only; it does not authorize any dataset outside the review ledger.
