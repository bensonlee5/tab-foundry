{{/* Google Fonts: Nunito (headings) + Source Sans 3 (body) */}}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">

{{ with .Page }}
{{ if .Params.katex }}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66uf4l5+" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" integrity="sha384-7zkQWkzuo3B5mTepMUcHkMB5jZaolc2xDwL6VFqjFALcbeS9Ggm/Yr2r3Dy4lfFg" crossorigin="anonymous"></script>
<script>
  function renderKatexNodes() {
    var root = document.querySelector(".td-content") || document.body;
    if (!root || !window.katex) {
      return;
    }
    root.querySelectorAll(".math-inline").forEach(function (node) {
      if (node.dataset.katexRendered === "true") {
        return;
      }
      window.katex.render(node.textContent || "", node, {
        displayMode: false,
        throwOnError: false
      });
      node.dataset.katexRendered = "true";
    });
    root.querySelectorAll(".math-display").forEach(function (node) {
      if (node.dataset.katexRendered === "true") {
        return;
      }
      window.katex.render(node.textContent || "", node, {
        displayMode: true,
        throwOnError: false
      });
      node.dataset.katexRendered = "true";
    });
  }

  if (document.readyState === "complete") {
    renderKatexNodes();
  } else {
    window.addEventListener("load", renderKatexNodes);
    document.addEventListener("DOMContentLoaded", renderKatexNodes);
  }
</script>
{{ end }}
{{ if .Params.mermaid }}
<script defer src="https://cdn.jsdelivr.net/npm/mermaid@11.13.0/dist/mermaid.min.js" integrity="sha384-tI0sDqjGJcqrQ8e/XKiQGS+ee11v5knTNWx2goxMBxe4DO9U0uKlfxJtYB9ILZ4j" crossorigin="anonymous"></script>
<script>
  window.addEventListener("load", function () {
    var mermaidBlocks = Array.prototype.slice.call(
      document.querySelectorAll("pre.mermaid, pre code.language-mermaid")
    );
    mermaidBlocks.forEach(function (node) {
      var pre = node.tagName === "PRE" ? node : node.closest("pre");
      if (!pre) {
        return;
      }
      var code = pre.tagName === "PRE" ? pre.querySelector("code") : node;
      var source = (code ? code.textContent : pre.textContent) || "";
      var diagram = document.createElement("div");
      diagram.className = "mermaid";
      diagram.textContent = source;
      pre.replaceWith(diagram);
    });

    if (window.mermaid) {
      window.mermaid.initialize({
        startOnLoad: false,
        theme: "neutral",
        securityLevel: "strict"
      });
      window.mermaid.run({ querySelector: ".mermaid" });
    }
  });
</script>
{{ end }}
{{ end }}
