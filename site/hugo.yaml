baseURL: https://bensonlee5.github.io/tab-foundry/
title: tab-foundry Docs
enableRobotsTXT: true
enableGitInfo: true
defaultContentLanguage: en
defaultContentLanguageInSubdir: false

module:
  imports:
    - path: github.com/google/docsy
  mounts:
    - source: content
      target: content
    - source: .generated/content
      target: content
    - source: static
      target: static
    - source: .generated/static
      target: static
    - source: assets
      target: assets
    - source: layouts
      target: layouts
    - source: data
      target: data
    - source: i18n
      target: i18n
    - source: archetypes
      target: archetypes

markup:
  goldmark:
    parser:
      attribute:
        block: true
    renderer:
      unsafe: true
  tableOfContents:
    startLevel: 2
    endLevel: 3
    ordered: false

copyright: tab-foundry contributors

params:
  description: "tab-foundry - tabular foundation model that generates its own training data and predicts on new tasks"
  github_repo: https://github.com/bensonlee5/tab-foundry
  github_project_repo: https://github.com/bensonlee5/tab-foundry
  ui:
    sidebar_search_disable: false
    breadcrumb_disable: false
    navbar_translucent_over_cover_disable: false
    sidebar_menu_foldable: true
    showLightDarkModeMenu: true
    navbar_logo: true
  links:
    user:
      - name: GitHub
        url: https://github.com/bensonlee5/tab-foundry
        icon: fab fa-github
    developer:
      - name: GitHub Issues
        url: https://github.com/bensonlee5/tab-foundry/issues
        icon: fab fa-github

menu:
  main:
    - name: Docs
      url: /docs/
      weight: 10
