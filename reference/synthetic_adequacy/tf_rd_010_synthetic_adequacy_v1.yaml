schema: tab-foundry-synthetic-adequacy-v1
adequacy_id: tf_rd_010_synthetic_adequacy_v1
status: ready
metric_definition: label-target log loss per test cell
blocked_sweeps:
- tf_rd_010_classification_evolution_medium_v4
- tf_rd_010_classification_evolution_large_v2
blocks:
- block_id: factorized_canary_easy_v1
  description: Easy factorized canary family where both a simple supervised baseline
    and the sandwich model should learn cleanly if the equation-(1) factorization
    and teacher-conditional export are healthy.
  corpus_ref: tf_rd_010_factorized_canary_v1
  n_ladder:
  - 128
  - 256
  - 512
  - 1024
  predictors:
  - chance
  - logistic_regression
  - sandwich
  repeats_per_n: 8
  teacher_conditionals: required
  notes:
  - Use this block to separate generator failures from model failures before reading
    TF-RD-010 medium dynamics.
- block_id: production_control_v3
  description: Production-shaped TF-RD-010 control family under the refreshed v3
    factorization semantics. This block answers whether the current sandwich model
    learns at all on the intended medium control front before any rerun.
  corpus_ref: tf_rd_010_dagzoo_medium_control_v3
  n_ladder:
  - 128
  - 256
  - 512
  - 1024
  predictors:
  - chance
  - sandwich
  repeats_per_n: 8
  teacher_conditionals: required
  notes:
  - Hold the test set fixed while resampling training datasets so prediction variance
    and teacher-vs-model bias proxies can be estimated across n.
decision_buckets:
  generator_problem: Simple baselines also fail, or teacher-conditional diagnostics
    are inconsistent with the emitted factorization-correct synthetic data.
  training_regime_problem: Simple baselines learn, the sandwich model underperforms,
    and variance or bias trends still indicate a learnable target family.
  architecture_capacity_problem: Simple baselines learn, sandwich learns weakly, and
    error-vs-n behavior suggests bias remains dominant even as variance falls.
notes:
- Treat all prior TF-RD-010 medium and large executions as historical operational context
  only until this adequacy gate is interpreted on the refreshed equation-(1) factorization.
- "The refreshed `*_v3` corpus family and canary pin `dagzoo`'s near-dense target-parent prior: `target_parent_prior=near_max_mixture`, modal parent count at the maximum, and only a small sparse tail below `sqrt(m)`."
- The canonical metric remains the existing persisted classification quantity
  `final_log_loss_at_matched_regime_budget`, interpreted here explicitly as label-target
  log loss per test cell.
