    schedulefree row before reading `adamw` and `muon`.
  - Compare `adamw` and `muon` directly against the locked TF-RD-020 anchor and against
    each other on the same uncapped harder-surface runtime.
  - '`tf_rd_020_noise_mixture_v1` remains the named fallback harder surface, but it
    is intentionally outside `tf_rd_018_optimizer_family_v1`.'
