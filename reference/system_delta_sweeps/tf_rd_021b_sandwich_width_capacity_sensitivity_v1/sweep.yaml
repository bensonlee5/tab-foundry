anchor_surface:
  notes:
  - This completed follow-up reuses the same registered compact hybrid control `tf_rd_021b_hybrid_full_cell_compact_prior_v1` that anchored the first TF-RD-021B knob-sensitivity screen.
  - The completed stage-1 screen did not identify a simpler winning topology setting, so this width and readout-head follow-up kept the compact hybrid control unchanged and executed directly on that locked anchor.
  - None of the bounded width or head-capacity rows beat the compact control on final log loss or final ROC AUC. The least harmful row was `d_icl=96` (`+0.0166` delta final log loss), while both head-width changes and the `d_icl=48` contraction were materially worse.
  - Keep the medium binary bundle, prior-dump surface, `runtime_default` preprocessing, `prior_cosine_warmup` recipe, and `2500`-step budget fixed across all rows.
  - This follow-up remains local-only; compare every row against the locked control on the pinned bundle without running any external comparator.
  - If the stage-1 screen finds a clearly better simpler topology setting, update the control and respin this package before execution rather than silently interpreting these rows against the wrong anchor.
  - The empirical power-curve phase comes after this bounded width or head read; do not collapse to a single-toggle scaling law until those many-run fits exist.
  dimension_table:
  - dimension: trunk width
    upstream: Width is the primary channel-capacity axis once topology is stable enough to scale.
    anchor: Compact hybrid control uses `d_icl=60` with `sandwich_heads=4`.
    interpretation: These rows read whether width is the first live post-topology scaling axis.
  - dimension: readout-head width
    upstream: Prediction-head capacity can matter independently of trunk width on compact models.
    anchor: Compact hybrid control uses `head_hidden_dim=96`.
    interpretation: These rows test whether head width matters independently before the later power-curve phase.
  - dimension: attention partitioning
    upstream: Not changed here.
    anchor: Keep `sandwich_heads=4` fixed.
    interpretation: Width rows should not confound total width with head-factor movement.
  - dimension: benchmark contract
    upstream: Not applicable.
    anchor: Locked medium binary bundle with no external comparator.
    interpretation: Keep the benchmark bundle fixed so this follow-up measures width or head sensitivity only.
  - dimension: training surface
    upstream: Not specified by PerceiverIO.
    anchor: Training surface label `prior_cosine_warmup`.
    interpretation: Budget and optimizer stay frozen so this follow-up is still an architecture-capacity read.
