schema: tab-foundry-synthetic-adequacy-v2
adequacy_id: tf_rd_010_synthetic_adequacy_v2
status: ready
metric_definition: label-target log loss per test cell
blocked_sweeps:
- tf_rd_010_classification_evolution_medium_v4
- tf_rd_010_classification_evolution_large_v2
blocks:
- block_id: latent_target_canary_easy_v2
  description: Easy latent-target canary family where simple supervised baselines
    should learn cleanly if the TabICLv2-style target derivation and lineage export
    are healthy.
  corpus_ref: tf_rd_010_latent_target_canary_v2
  n_ladder:
  - 128
  - 256
  - 512
  - 1024
  predictors:
  - chance
  - logistic_regression
  repeats_per_n: 8
  notes:
  - Use this block to separate generator failures from model failures before reading
    TF-RD-010 medium dynamics.
- block_id: production_control_v4
  description: Production-shaped TF-RD-010 control family under the latent-target
    derivation contract. This block answers whether the current sandwich model
    learns at all on the intended medium control front before any rerun.
  corpus_ref: tf_rd_010_dagzoo_medium_control_v4
  n_ladder:
  - 128
  - 256
  - 512
  - 1024
  predictors:
  - chance
  - sandwich
  repeats_per_n: 8
  notes:
  - Hold the test set fixed while resampling training datasets so prediction variance
    and instability can be estimated across n without teacher-relative metrics.
decision_buckets:
  generator_problem: Latent-target lineage validation fails, or the simple canary
    baselines fail on data that should be learnable.
  training_regime_problem: Latent-target lineage validates, the canary baselines
    learn, and the sandwich production-control pilot is still unstable or non-learning.
  inconclusive: Latent-target lineage validates, the canary baselines learn, and
    the single CPU production-control pilot is not decisively broken.
notes:
- Treat all prior TF-RD-010 medium and large executions as historical operational context
  only until this adequacy gate is interpreted on the refreshed latent-target contract.
- The canonical metric remains the existing persisted classification quantity
  `final_log_loss_at_matched_regime_budget`, interpreted here explicitly as label-target
  log loss per test cell.
