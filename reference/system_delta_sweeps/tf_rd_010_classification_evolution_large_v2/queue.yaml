schema: tab-foundry-system-delta-sweep-queue-v1
sweep_id: tf_rd_010_classification_evolution_large_v2
rows:
- order: 1
  delta_ref: delta_data_manifest_root_tf_rd_010_dagzoo_medium_control
  status: completed
  rationale: Establish the TF-RD-010 classification control front on the larger benchmark
    rung before reading any missingness harder-front effect.
  hypothesis: The evolved sandwich family should first be judged on the TF-RD-010
    control corpus against the frozen local large validation bundle, then promoted
    as the same-invocation anchor for rows 2 through 4.
  anchor_delta: Use the evolved FiLM plus 3-summary-token sandwich contract and benchmark
    the completed control pilot trained on `tf_rd_010_dagzoo_medium_control_curated_v5`
    against the local large classification manifest without retraining.
  model:
    arch: tabfoundry_sandwich
    d_icl: 60
    input_normalization: train_zscore_clip
    many_class_base: 10
    head_hidden_dim: 96
    sandwich_latents: 24
    sandwich_layers: 2
    sandwich_heads: 4
    sandwich_ff_expansion: 2
    sandwich_summary_tokens_per_axis: 3
    sandwich_self_attention_per_cross: 4
    sandwich_pre_row_attention_layers: 1
    sandwich_pre_column_attention_layers: 1
    feature_type_conditioning: film
  data:
    surface_label: tf_rd_010_dagzoo_medium_control
    source: manifest
    corpus_ref: tf_rd_010_dagzoo_medium_control_curated_v5
  preprocessing:
    surface_label: runtime_default
  training:
    surface_label: prior_cosine_warmup
    task_batch_size: 16
    prior_dump_batch_size: 64
    synthetic_epoch_budget:
      epochs: 1
      budget_unit: corpus_manifest_records
      prior_dump_batch_size: 64
      allow_partial_final_batch: true
    overrides:
      schedule:
        stages:
        - name: prior_dump
          lr_max: 0.001
          lr_schedule: linear
          warmup_ratio: 0.1
      runtime:
        grad_accum_steps: 4
      optimizer:
        min_lr: 1.0e-05
  reuse_train_artifact:
    run_dir: outputs/research/adequacy/tf_rd_010_synthetic_adequacy_v3/pilot/production_control_curated_v5/train
    training_surface_fingerprint: 1614c767510feacd669b4868fd2dfacbe7332f0b64b9c694c448caca85794d20
  parameter_adequacy_plan:
  - Confirm the local `openml_classification_large_v1` manifest still matches frozen
    baseline task ids `[363685, 363699, 363707]` before execution.
  - Freeze the legacy `cls_benchmark_linear_multiclass_large_v1` control baseline
    before treating any row outcome as a promotion or defer decision.
  - Rank by `final_log_loss_at_matched_regime_budget`, interpreted explicitly as label-target
    log loss per test cell, then inspect calibration, runtime, and stability as guardrails.
  benchmark_checkpoint_selection: all
  next_action: Keep the original `medium_v4` control as the TF-RD-010 carried comparator,
    and preserve this completed large control row as the harder-rung reference; do
    not reopen `large_v2` within TF-RD-010.
  notes:
  - '`dagzoo` owns this synthetic training front; `tab-realdata-hub` owns the validation
    manifest lineage.'
  - 'This corpus keeps the same balanced 144-cell DAGZoo front shape but expands it
    to `159984` corpus manifest records/tasks: `144` invocation cells x `1111` datasets,
    still capped at `<=1024` total rows per synthetic dataset.'
  - 'Trusted executions use a single synthetic epoch only: one pass over `159984`
    corpus manifest records/tasks at `prior_dump_batch_size=64`, which resolves to
    `2500` optimizer steps with an allowed short final batch.'
  - This row remains the intended TF-RD-010 large reference for missingness transfer
    and class-imbalance reporting on the large validation pool.
  - '`tf_rd_010_classification_evolution_large_v2` shares the pilot-aligned training
    surface with the refreshed medium package: `task_batch_size=16`, `grad_accum_steps=4`,
    `runtime.grad_clip=0.0`, `max_steps=2500`, linear schedule with `warmup_ratio=0.10`,
    `lr_max=1e-3`, and `optimizer.min_lr=1e-5`.'
  - Reuse the completed pilot control training artifact at `outputs/research/adequacy/tf_rd_010_synthetic_adequacy_v3/pilot/production_control_curated_v5/train`;
    do not retrain the control row for `large_v2`.
  - The local large benchmark bundle is preflighted against the frozen `cls_benchmark_linear_multiclass_large_v1`
    contract with task ids `[363685, 363699, 363707]`.
  - Canonical rerun registered as `sd_tf_rd_010_classification_evolution_large_v2_01_delta_data_manifest_root_tf_rd_010_dagzoo_medium_control_v1`.
  - With the original `medium_v4` control kept over the worse `medium_v5` replay,
    this completed large control row remains the best large-rung result and the
    carried harder-rung reference.
  run_id: sd_tf_rd_010_classification_evolution_large_v2_01_delta_data_manifest_root_tf_rd_010_dagzoo_medium_control_v1
  followup_run_ids: []
  decision: defer
