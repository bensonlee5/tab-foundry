  description: Point training at the TF-RD-020 noise-drift harder-front manifest while
    keeping the settled four-task row-first recipe fixed.
  rationale: Open issue `#137` by replaying the settled schedulefree baseline on the
    documented TF-RD-020 noise-drift carry-forward surface before comparing any non-schedulefree
    optimizer family.
  hypothesis: Replaying the kept TF-RD-018 four-task schedulefree recipe on `tf_rd_020_shift_noise_drift_v1`
    should provide the cleanest optimizer baseline and remove the TF-RD-020 harmonized
    `400`-step recipe as a confounder.
