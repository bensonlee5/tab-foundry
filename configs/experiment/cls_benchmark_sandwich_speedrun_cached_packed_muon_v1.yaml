# @package _global_

defaults:
  - cls_benchmark_sandwich_speedrun_cached_packed_v1
  - _self_

optimizer:
  name: muon
  require_requested: true
  weight_decay: 0.01
  betas: [0.9, 0.95]
  min_lr: 1.0e-6
  muon_per_parameter_lr: true
  muon_lr_scale_base: 0.2
  muon_partition_non2d: true

logging:
  run_name: cls-benchmark-sandwich-speedrun-cached-packed-muon-v1

runtime:
  output_dir: outputs/cls_benchmark_sandwich_speedrun_cached_packed_muon_v1
