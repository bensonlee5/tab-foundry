  delta_id: delta_data_manifest_root_tf_rd_020_missingness_mcar
  status: ready
  dimension_family: data
  family: missingness
  binary_applicable: true
  description: Point training at the TF-RD-020 MCAR harder-front manifest while keeping
    the settled four-task row-first recipe fixed.
  rationale: Open issue `#148` with the lowest-assumption missingness row so TF-RD-020
    can test whether moderate MCAR alone is enough to create a harder synthetic front.
  hypothesis: A `25%` MCAR variant may increase sample difficulty without introducing
    the label-correlated structure of MAR or MNAR.
  upstream_delta: Not applicable; this is a repo-local synthetic-data harder-front
    axis.
  anchor_delta: Keep the settled row-first model, preprocessing surface, and four-task
    warmup-decay recipe fixed, but replace the carried medium corpus with `tf_rd_020_missingness_mcar_v1`.
  entangled_legacy_stage: none
  expected_effect: Moderate MCAR may make the synthetic training surface harder without
    introducing mechanism-linked missingness structure.
  adequacy_knobs:
  - explicit `missing_rate` and `missing_mechanism` resolution across the carried
    `8/28/4` invocation mix
  - manifest-contract deltas versus the kept TF-RD-013 medium control
  - benchmark-facing generalization under the settled four-task row-first recipe
  parameter_adequacy_policy:
    default_plan:
    - Confirm the materialized corpus preserves the carried `8/28/4` invocation mix
      before reading benchmark output.
    - Compare final ROC AUC first, final log loss and Brier second, and best-to-final
      ROC delta third against the medium control and the other missingness rows.
    - Treat runtime, clipped-step fraction, fallback, NaNs, and OOM or retry behavior
      as guardrails rather than primary selection metrics.
    default_negative_decision: defer
