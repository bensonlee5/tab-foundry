    was clearly harmful to remove in TF-RD-021B.
  hypothesis: >-
    If the row-wise pre-Perceiver mixer is still capacity-limited on the current
    medium contract, increasing `sandwich_pre_row_attention_layers` from `1` to `2`
    may improve benchmark quality enough to beat the current best `sandwich_heads=2`
    row before scaling.
  anchor_delta: >-
