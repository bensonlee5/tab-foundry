schema: tab-foundry-system-delta-sweep-queue-v1
sweep_id: tf_rd_010_classification_evolution_medium_v2
rows:
- order: 1
  delta_ref: delta_data_manifest_root_tf_rd_010_dagzoo_medium_control
  status: completed
  rationale: Establish the TF-RD-010 classification control front before reading any
    missingness harder-front effect on the smaller medium benchmark rung.
  hypothesis: The evolved sandwich family should first be judged on the TF-RD-010
    control corpus (`n_classes_min=2`) against the medium hub manifest.
  anchor_delta: Use the evolved FiLM plus 3-summary-token sandwich contract and train
    on `tf_rd_010_dagzoo_medium_control_v2` while validating on the hub-owned medium
    classification manifest.
  model:
    arch: tabfoundry_sandwich
    d_icl: 60
    input_normalization: train_zscore_clip
    many_class_base: 10
    head_hidden_dim: 96
    sandwich_latents: 24
    sandwich_layers: 2
    sandwich_heads: 4
    sandwich_ff_expansion: 2
    sandwich_summary_tokens_per_axis: 3
    sandwich_self_attention_per_cross: 4
    sandwich_pre_row_attention_layers: 1
    sandwich_pre_column_attention_layers: 1
    feature_type_conditioning: film
  data:
    surface_label: tf_rd_010_dagzoo_medium_control
    source: manifest
    corpus_ref: tf_rd_010_dagzoo_medium_control_v2
  preprocessing:
    surface_label: runtime_default
  training:
    surface_label: prior_cosine_warmup
    task_batch_size: 1
    prior_dump_batch_size: 64
    synthetic_epoch_budget:
      epochs: 1
      budget_unit: corpus_manifest_records
      prior_dump_batch_size: 64
      allow_partial_final_batch: true
    overrides:
      schedule:
        stages:
        - name: prior_dump
          lr_max: 0.004
          lr_schedule: cosine
          warmup_ratio: 0.05
  parameter_adequacy_plan:
  - Confirm `tab-realdata-hub#1` has materialized the medium classification manifest
    from `openml_classification_medium_v1.json` before execution.
  - Freeze the legacy `cls_benchmark_linear_multiclass_medium_v1` control baseline
    before treating any row outcome as a promotion or defer decision.
  - Rank by `final_bpc_at_matched_regime_budget`, then inspect raw log loss, calibration,
    runtime, and stability as guardrails.
  next_action: Execute this row under issue `#205` as the active medium anchor candidate
    for the expanded one-epoch 2500-step TF-RD-010 successor package.
  notes:
  - '`dagzoo` owns this synthetic training front; `tab-realdata-hub` owns the validation
    manifest.'
  - 'This corpus keeps the same balanced 144-cell DAGZoo front shape but expands it
    to 159984 corpus manifest records/tasks: 144 invocation cells x 1111 datasets,
    still capped at <=1024 total rows per synthetic dataset.'
  - 'Trusted executions use a single synthetic epoch only: one pass over 159984 corpus
    manifest records/tasks at `prior_dump_batch_size=64`, which resolves to `2500`
    optimizer steps with an allowed short final batch.'
  - This row remains the intended TF-RD-010 medium reference for missingness and class-imbalance
    reporting on the medium validation pool.
  - Historical 400-step TF-RD-010 executions are invalidated and retained only as
    non-canonical artifacts.
  - Trusted rerun work now flows through issues `#202`, `#205`, and `#204`.
  - The completed March 30, 2026 `tf_rd_010_classification_evolution_medium_v1` sweep
    remains the historical medium evidence; `tf_rd_010_classification_evolution_medium_v2`
    is the active medium successor regime.
  - Canonical rerun registered as `sd_tf_rd_010_classification_evolution_medium_v2_01_delta_data_manifest_root_tf_rd_010_dagzoo_medium_control_v1`.
  - Pending review for TF-RD-010 medium_v2 2500-step successor regime.
  run_id: sd_tf_rd_010_classification_evolution_medium_v2_01_delta_data_manifest_root_tf_rd_010_dagzoo_medium_control_v1
  followup_run_ids: []
  decision: defer
