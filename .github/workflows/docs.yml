name: docs

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - ".github/workflows/docs.yml"
      - "README.md"
      - "CONTRIBUTING.md"
      - "docs/**"
      - "reference/**"
      - "program.md"
      - "site/**"
      - "scripts/docs/**"
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.22"

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.158.0"
          extended: true

      - name: Install site dependencies
        run: npm install --prefix site

      - name: Sync generated Hugo content
        run: python scripts/docs/sync_hugo_content.py

      - name: Check generated Hugo content
        run: python scripts/docs/sync_hugo_content.py --check

      - name: Check source-doc links
        run: python scripts/docs/check_links.py

      - name: Build Hugo site
        run: hugo --source site --minify --gc --destination public

      - name: Check built output links
        run: python scripts/docs/check_built_output_links.py site/public

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/public

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Verify deployed Hugo site
        env:
          SITE_URL: https://bensonlee5.github.io/tab-foundry
        run: |
          python3 - <<'PY'
          import sys
          import time
          import urllib.error
          import urllib.request

          SITE_URL = "https://bensonlee5.github.io/tab-foundry"

          checks = [
              (
                  f"{SITE_URL}/",
                  ("<meta name=generator content=\"Hugo", "Read the Docs"),
                  ("Jekyll v3.10.0",),
              ),
              (
                  f"{SITE_URL}/docs/",
                  ("Start Here", "/docs/repo-overview/"),
                  ("Jekyll v3.10.0",),
              ),
              (
                  f"{SITE_URL}/docs/development/model-architecture/",
                  ("cdn.jsdelivr.net/npm/mermaid", "cdn.jsdelivr.net/npm/katex"),
                  ("Jekyll v3.10.0",),
              ),
              (
                  f"{SITE_URL}/docs/getting-started/problem-formulation/",
                  ("cdn.jsdelivr.net/npm/katex",),
                  ("Jekyll v3.10.0",),
              ),
              (
                  f"{SITE_URL}/docs/development/model-architecture.html",
                  ("/docs/development/model-architecture/",),
                  ("404",),
              ),
              (
                  f"{SITE_URL}/docs/development/synthetic-prior-mission.html",
                  ("/docs/getting-started/problem-formulation/",),
                  ("404",),
              ),
          ]

          def fetch(url: str) -> str:
              with urllib.request.urlopen(url, timeout=20) as response:
                  return response.read().decode("utf-8", errors="replace")

          failures: list[str] = []
          for url, required, forbidden in checks:
              last_error = ""
              for _ in range(18):
                  try:
                      body = fetch(url)
                  except urllib.error.HTTPError as exc:
                      last_error = f"{url} returned HTTP {exc.code}"
                      time.sleep(10)
                      continue
                  except urllib.error.URLError as exc:
                      last_error = f"{url} failed to load: {exc.reason}"
                      time.sleep(10)
                      continue

                  missing = [token for token in required if token not in body]
                  blocked = [token for token in forbidden if token in body]
                  if not missing and not blocked:
                      break

                  details: list[str] = []
                  if missing:
                      details.append(f"missing {missing}")
                  if blocked:
                      details.append(f"forbidden {blocked}")
                  last_error = f"{url} " + ", ".join(details)
                  time.sleep(10)
              else:
                  failures.append(last_error or f"{url} failed verification")

          if failures:
              print("Live Pages verification failed:")
              for failure in failures:
                  print(f"- {failure}")
              sys.exit(1)
          PY
