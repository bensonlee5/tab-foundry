    to `mixed_precision="no"` because sweep execution is CPU-only.
  - Keep the global `norm_type=layernorm` contract unchanged; only the sandwich-internal
    `sandwich_block_norm` switch is live here.
  - Row `01` is the norm-free GELU control and row `02` adds the rational activation
    on top of that control.
  - Read this as a screen, not a promotion sweep. If the rational row wins, rerun
    it later on the benchmark-facing runtime before any anchor or roadmap decision.
  dimension_table:
  - dimension: internal block normalization
    upstream: The theory paper does not prescribe this repo-local sandwich block-norm
      split directly.
    anchor: The carried TF-RD-010 medium anchor keeps sandwich internal block norms
      enabled through `sandwich_block_norm=layernorm`.
    interpretation: Row `01` isolates whether removing the internal sandwich block
      norms is a viable control surface before the rational swap is read.
  - dimension: activation family
    upstream: The paper argues trainable rational activations can improve transformer
      optimization and expressivity.
    anchor: The carried TF-RD-010 medium anchor uses GELU throughout the sandwich
      core FF blocks.
    interpretation: Row `02` reads the local version-A `5/4` rational activation only
      after the norm-free GELU control is defined.
  - dimension: corpus and validation contract
    upstream: Not applicable.
    anchor: Keep the manifest-backed dagzoo control corpus `tf_rd_010_dagzoo_medium_control_curated_v5`
      and the medium classification validation manifest fixed.
    interpretation: This sweep does not reopen corpus choice, missingness, or the
      real-data benchmark bundle.
  - dimension: runtime surface
    upstream: The paper does not define this repo's prior-dump runtime policy.
    anchor: Inherit the TF-RD-022 sandwich benchmark training surface, but force CPU
      execution with `mixed_precision="no"` for this screen.
    interpretation: This lane answers whether the activation change is promising enough
      to earn a later benchmark-rerun, not whether CPU is the final runtime policy.
