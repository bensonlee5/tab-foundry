        grad_accum_steps: 4
        trace_activations: false
        activation_checkpointing: false
        eval_every: 25
        checkpoint_every: 25
        val_batches: 0
        max_steps: 2500
      schedule:
        stages:
        - name: prior_dump
          steps: 2500
          lr_max: 0.001
          lr_schedule: linear
