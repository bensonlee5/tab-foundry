anchor_surface:
  notes:
  - TF-RD-022 is now closed on the kept compile-eager-dynamic runtime surface from
    [#247](https://github.com/bensonlee5/tab-foundry/issues/247), so this follow-on
    sweep inherits the explicit compile-enabled execution contract rather than the
    earlier pre-compile TF-RD-010 control surface.
  - The locked anchor is benchmark registry run `sd_tf_rd_024_classification_knob_sweep_v1_anchor_compile_eager_dynamic_v1`,
    trained on `cls_benchmark_sandwich_classification_evolution_tf_rd_022_policy_compile_eager_dynamic_v1`
    and benchmarked on the closed TF-RD-010 medium rung at `final_log_loss=0.6820309591`.
  - The same trained anchor already has a sequential large-rung reference at `final_log_loss=0.9298541427`,
    so any medium keep signal from this sweep still needs to hold on the closed TF-RD-010
    large contract before the knob is carried forward.
  - Medium is the screening rung for this epic. Any row that looks keep-worthy on
    medium still needs validation on the closed TF-RD-010 large contract before the
    knob is carried forward.
  - Keep the `dagzoo -> tab-realdata-hub -> tab-foundry` benchmark contract fixed.
    This sweep does not reopen TF-RD-021 or dagzoo RD-002/RD-005; those remain sidecar
    synthetic-data context rather than blockers on the main line.
  - Reuse the historical TF-RD-021B sandwich delta families where possible so this
    post-performance lane stays a bounded architecture-knob read instead of becoming
    a parallel search program.
  - 'Freeze the inherited runtime and training surface from `cls_benchmark_sandwich_classification_evolution_tf_rd_022_policy_compile_eager_dynamic_v1`:
    `task_batch_size=16`, `prior_dump_batch_size=64`, `mixed_precision=bf16`, `trace_activations=false`,
    `activation_checkpointing=true`, `grad_accum_steps=4`, `grad_clip=0.0`, `compile_model=true`,
    `compile_backend=eager`, `compile_dynamic=true`, `max_steps=2500`, `optimizer.min_lr=1e-5`,
    and linear warmup at `lr_max=1e-3`.'
  - The only live architecture knobs in this sweep are `head_hidden_dim`, `sandwich_summary_tokens_per_axis`,
    `sandwich_latents`, `sandwich_heads`, `sandwich_ff_expansion`, and `sandwich_self_attention_per_cross`.
  - Keep `d_icl`, `sandwich_layers`, batch size, LR, clipping, optimizer family, and
    corpus choice out of scope here; those remain reserved for TF-RD-009 or other
    dedicated training-surface follow-up.
  dimension_table:
  - dimension: latent bank size
    upstream: Perceiver-style models use latent count as an explicit memory and fidelity
      knob.
    anchor: TF-RD-010 medium control uses `sandwich_latents=24`.
    interpretation: Read latent count only as a bounded post-performance architecture
      knob on the closed multiclass benchmark contract.
  - dimension: attention partitioning
    upstream: Transformer head count changes factorization without changing total
      width.
    anchor: TF-RD-010 medium control uses `sandwich_heads=4`.
    interpretation: If the lower head bracket is weak here, head count should stay
      frozen outside later scale-law work.
  - dimension: feed-forward width
    upstream: FF expansion changes per-token capacity independently of attention routing.
    anchor: TF-RD-010 medium control uses `sandwich_ff_expansion=2`.
    interpretation: This reads trunk MLP capacity only after runtime policy is fixed.
  - dimension: summary-stream bandwidth
    upstream: Sandwich summary tokens trade compact contextual bandwidth against compute.
    anchor: TF-RD-010 medium control uses `sandwich_summary_tokens_per_axis=3`.
    interpretation: If the current benchmark contract mostly benefits from the broader
      hybrid structure, summary multiplicity should be a bounded follow-on knob rather
      than a fresh architecture branch.
  - dimension: latent self-refinement depth
    upstream: Perceiver-style models can vary how much latent self-attention happens
      between cross-attention reads.
    anchor: TF-RD-010 medium control uses `sandwich_self_attention_per_cross=4`.
    interpretation: This asks whether repeated latent refinement is still carrying
      signal once the direct multiclass benchmark surface is fixed.
  - dimension: readout capacity
    upstream: Head-hidden width changes prediction-head capacity without reopening
      trunk width or depth.
    anchor: TF-RD-010 medium control uses `head_hidden_dim=96`.
    interpretation: Treat readout width as a bounded post-performance follow-up, not
      as a proxy for `d_icl` or broader scaling work.
  - dimension: benchmark contract
    upstream: Not applicable.
    anchor: TF-RD-010 medium contract screens rows first; any keep must then validate
      on the closed TF-RD-010 large contract.
    interpretation: Medium is the fast screening rung, but promotion requires consistency
      on the harder large rung before the knob stays live.
  - dimension: training and runtime surface
    upstream: No external paper fixes this exact prior-dump or runtime policy.
    anchor: Training experiment `cls_benchmark_sandwich_classification_evolution_tf_rd_022_policy_compile_eager_dynamic_v1`
      with the kept TF-RD-022 compile-eager-dynamic runtime policy.
    interpretation: Hold optimizer, schedule, batching, and runtime policy fixed so
      this sweep isolates architecture knobs only.
