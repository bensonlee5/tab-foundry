anchor_surface:
  notes:
  - This sweep opens TF-RD-018 issue `#137` by comparing optimizer families directly
    against the completed TF-RD-020 noise-drift winner after the harder-front ladder
    removed dataset row caps.
  - Keep the settled row-first model, preprocessing surface, benchmark bundle, and
    harmonized `task_batch_size=1`, `grad_accum_steps=4`, `400`-step runtime fixed;
    only the inherited harder data surface and optimizer family are in scope here.
  - The locked anchor is benchmark registry run `sd_tf_rd_020_harder_dagzoo_ladder_v1_06_delta_data_manifest_root_tf_rd_020_shift_noise_drift_v2`
    on `tf_rd_020_shift_noise_drift_v1`; TF-RD-018 does not replay or promote a separate
    schedulefree row before reading `adamw` and `muon`.
  - Compare `adamw` and `muon` directly against the locked TF-RD-020 anchor and against
    each other on the same uncapped harder-surface runtime.
  - '`tf_rd_020_noise_mixture_v1` remains the named fallback harder surface, but it
    is intentionally outside `tf_rd_018_optimizer_family_v1`.'
  dimension_table:
  - dimension: locked anchor
    upstream: TabICLv2 motivates synthetic pretraining but does not define this repo-local
      row-first promoted-anchor contract.
    anchor: The kept `row_cls + qass + no tfcol` TF-RD-020 noise-drift winner trained
      on the uncapped `task_batch_size=1`, `grad_accum_steps=4`, `400`-step runtime.
    interpretation: TF-RD-018 issue `#137` must keep the promoted row-first model
      surface fixed while reading optimizer-family evidence.
  - dimension: harder carry-forward surface
    upstream: No upstream reference defines this exact dagzoo harder-surface handoff.
    anchor: The locked harder-surface anchor is `tf_rd_020_shift_noise_drift_v1`, inherited
      directly from TF-RD-020 row `06`.
    interpretation: The TF-RD-020 noise-drift winner is already the carried optimizer
      anchor for this sweep rather than a replay target inside the queue.
  - dimension: optimizer family
    upstream: Not applicable.
    anchor: Schedulefree AdamW on the inherited TF-RD-020 row-`06` runtime is the locked
      comparison baseline for this sweep.
    interpretation: Compare `adamw` and `muon` on the same harder-surface recipe before
      reopening LR, clipping, or budget work.
  - dimension: fallback scope
    upstream: Not applicable.
    anchor: '`tf_rd_020_noise_mixture_v1` is excluded from this v1 sweep.'
    interpretation: If noise drift is too confounded, stop with an explicit defer
      note and open fallback-surface work separately rather than broadening
