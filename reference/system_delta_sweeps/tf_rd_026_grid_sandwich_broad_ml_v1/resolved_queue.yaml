anchor_surface:
  notes:
  - The carried grid sandwich anchor is registered as `sd_tf_rd_009_sandwich_followons_medium_metadatafix_20260420_03_grid_pilot_v1`,
    but its local executable checkpoint is not present and the registry entry lacks
    persisted remote artifact metadata.
  - Row `01` is therefore the formal control replay for this sweep. Execute it first
    with `--promote-first-executed-row-to-anchor`; subsequent rows compare against
    that freshly promoted sweep anchor.
  - The carried anchor target remains `final_log_loss_at_matched_regime_budget=0.4221534937`
    on the medium surface; promotion from this sweep still requires beating that level
    without material Brier or ROC-AUC regression.
  - Keep the medium v6 corpus, Muon optimizer, 5000-step prior-dump budget, W&B logging,
    and A100 80GB runtime profile fixed across rows.
  - Rows `02` through `05` isolate one broad-ML architecture mechanism at a time.
    Row `06` is blocked until the standalone hyper-connection-lite and SwiGLU rows
    both train cleanly.
  - Row `05` is now interpreted as a full-shared-layer efficiency baseline. Localized
    recurrence candidates should be selected by the grid-core perturbation diagnostic
    against the row `01` checkpoint before training blocked follow-on rows.
  - Row `09` follows up row `05` by combining the shared recurrent grid core with
    SwiGLU FFN capacity while keeping row `06` and diagnostic placeholder rows blocked.
  - Rows `10` and `11` follow up row `09` by keeping eight recurrent grid-core applications
    and SwiGLU FFNs, but cycling two or four distinct grid mixer layers instead of
    sharing one layer across all recurrent passes.
  dimension_table:
  - dimension: residual topology
    upstream: Hyper-Connection-style multi-stream residual routing can improve deep
      transformer optimization by giving mixers more stable state paths.
    anchor: The grid sandwich control uses ordinary prenorm residuals in each row
      and column mixer block.
    interpretation: Read `hyper_connection_lite` as a topology test inside the grid
      row/column blocks, not as a return to routed evidence-bank behavior.
  - dimension: distractor suppression
    upstream: Differential attention subtracts a learned fraction of a second attention
      map from the primary map to suppress common-mode distractors.
    anchor: The grid sandwich control uses standard attention in row and column mixing.
    interpretation: Read this as an attention-form test at fixed width, depth, data,
      and optimizer budget.
  - dimension: gated token capacity
    upstream: SwiGLU-style gated FFNs often improve transformer quality at matched
      or near-matched parameter budgets.
    anchor: The grid sandwich control uses GELU FFNs.
    interpretation: Read this as a cell-token FFN capacity test without changing the
      surrounding grid topology.
  - dimension: recurrent refinement
    upstream: Sharing a transformation across recurrent iterations can improve iterative
      reasoning while controlling parameter count.
    anchor: The grid sandwich control instantiates four distinct grid mixer layers.
    interpretation: Read `grid_recurrence_steps=8` with no unique-layer override as
      a full-shared-layer efficiency baseline. Read `grid_recurrence_unique_layers`
      as the recurrent cycle size for follow-ups that test whether recurrence needs
      more distinct transformations before running localized chunk-repeat candidates.
