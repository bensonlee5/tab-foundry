anchor_surface:
  notes:
  - This TF-RD-010 medium successor sweep preserves the completed `tf_rd_010_classification_evolution_medium_v4`
    package as historical evidence while reopening only the control row as a matched
    sorted-order follow-up. `medium_v4` row 1 reused the older unsorted control
    train artifact, so `medium_v5` exists to retrain that same control front under
    the current sorted-order code path before any missingness promotion.
  - Treat issues `#52`, `#99`, `#197`, `#199`, `#200`, and the completed `#205`
    package as historical setup or execution context only; issue `#202` is the
    active umbrella for this single-row follow-up.
  - Treat TF-RD-021B as historical context only; this package continues the modest
    sandwich architecture evolution rather than reopening the frozen four-token carry-forward.
  - '`dagzoo` owns the synthetic training corpora for every row in this sweep.'
  - 'The active TF-RD-010 synthetic corpora preserve the explicit balanced DAGZoo
    front shape while expanding to `159984` corpus manifest records/tasks per front:
    `144` invocation cells x `1111` datasets, capped at `<=1024` total rows per synthetic
    dataset, with row totals `128/256/512/1024`, feature counts `6/10/14/20`, and
    class counts covering every integer from `2` through `10`.'
  - '`tab-realdata-hub` issue `bensonlee5/tab-realdata-hub#1` owns the medium and
    large classification validation bundles plus their materialized manifest parquet
    outputs from `openml_classification_medium_v1.json` and `openml_classification_large_v1.json`.'
  - The evolved sandwich contract is FiLM-conditioned, uses `sandwich_summary_tokens_per_axis=3`,
    `many_class_base=10`, and a direct multiclass head.
  - Rank rows by `final_log_loss_at_matched_regime_budget`, interpreted explicitly
    as label-target log loss per test cell, then inspect calibration, runtime, stability,
    and any retained legacy cell-likelihood diagnostics as guardrails only.
  - The medium validation rung follows the upstream hub bundle policy `min_classes=2`,
    `max_classes=10`, and `max_missing_pct=20.0`; the repo-local `openml_classification_medium_v1`
    manifest is still a stale placeholder and must not be treated as canonical benchmark-facing
    evidence.
  - 'Trusted executions follow the pilot-aligned synthetic one-epoch policy for corpus-backed
    rows: one pass over `159984` corpus manifest records/tasks at `prior_dump_batch_size=64`,
    resolving to `2500` optimizer steps with `task_batch_size=16`, `runtime.grad_accum_steps=4`,
    `runtime.grad_clip=0.0`, linear schedule `warmup_ratio=0.10`, `lr_max=1e-3`, and
    `optimizer.min_lr=1e-5`.'
  - This sweep intentionally keeps only one row so the follow-up resolves the control-order
    confound without reopening the exploratory medium missingness rows.
  - This sweep does not reuse `outputs/research/adequacy/tf_rd_010_synthetic_adequacy_v3/pilot/production_control_curated_v5/train`;
    row 1 must retrain `tf_rd_010_dagzoo_medium_control_curated_v5` fresh under
    the current sorted-order code path before benchmarking on the hub-backed medium
    manifest.
  - This row is now benchmarked and recorded. Compare the completed sorted-order
    control directly against `tf_rd_010_classification_evolution_medium_v4` rows
    2 through 4 before promoting any missingness recommendation, and decide whether
    later medium and large interpretation should carry forward the original `medium_v4`
    control or this sorted-order replay.
  dimension_table:
  - dimension: benchmark ownership
    upstream: Not applicable.
    anchor: '`dagzoo` owns the synthetic training fronts while `tab-realdata-hub`
      owns the real-data validation manifests.'
    interpretation: This sweep preserves the repo-to-repo contract from `medium_v4`
      while isolating the row-order confound on the control row.
  - dimension: classification head
    upstream: Label-conditioning choices should stay modular so target handling can
      evolve after the backbone stabilizes.
    anchor: Direct multiclass head with `many_class_base=10`.
    interpretation: Treat this as the same bounded head/output evolution rather than
      reopening staged or hierarchical many-class variants.
  - dimension: summary bandwidth
    upstream: Historical TF-RD-021B evidence used `sandwich_summary_tokens_per_axis=4`.
    anchor: The evolved benchmark surface uses `sandwich_summary_tokens_per_axis=3`.
    interpretation: '`medium_v5` keeps the same evolved sandwich contract and changes
      only the control-row training provenance.'
  - dimension: validation surface
    upstream: Not applicable.
    anchor: Hub-backed medium classification manifest under local benchmark-manifest
      id `openml_classification_medium_v1`, materialized from `openml_classification_medium_v1.json`.
    interpretation: Keep the smaller hub-backed classification validation rung fixed
      while the control row is retrained under the sorted-order code path.
