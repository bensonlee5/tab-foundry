schema: tab-foundry-system-delta-sweep-queue-v1
sweep_id: tf_rd_024_classification_heads_prerow_followup_v1
rows:
- order: 1
  delta_ref: delta_tf_rd_024_followup_cls_sandwich_heads1_v1
  status: ready
  rationale: >-
    Follow the completed TF-RD-024 medium winner `sandwich_heads=2` with one lower
    head-partition bracket to test whether the gain reflects a broader low-head regime
    before TF-RD-009 freezes topology.
  hypothesis: >-
    If the `sandwich_heads=2` win reflects excess head factorization rather than
    a narrow local optimum, reducing `sandwich_heads` from `4` to `1` may stay
    competitive or improve further on the closed medium contract.
  anchor_delta: >-
    Changes `model.sandwich_heads` from `4` to `1` while holding `d_icl=60`,
    `sandwich_layers=2`, `sandwich_latents=24`, the compile-eager-dynamic runtime
    surface, and the closed TF-RD-010 medium benchmark contract fixed.
  model:
    arch: tabfoundry_sandwich
    d_icl: 60
    input_normalization: train_zscore_clip
    many_class_base: 10
    head_hidden_dim: 96
    sandwich_latents: 24
    sandwich_layers: 2
    sandwich_heads: 1
    sandwich_ff_expansion: 2
    sandwich_summary_tokens_per_axis: 3
    sandwich_self_attention_per_cross: 4
    sandwich_pre_row_attention_layers: 1
    sandwich_pre_column_attention_layers: 1
    sandwich_pre_column_inducing_tokens: 16
    feature_type_conditioning: film
    floating_likelihood: single_gaussian
    integer_likelihood: hybrid_mixture
  data:
    surface_label: tf_rd_010_dagzoo_medium_control
    source: manifest
    corpus_ref: tf_rd_010_dagzoo_medium_control_curated_v5
    surface_overrides:
      source: manifest
      corpus_ref: tf_rd_010_dagzoo_medium_control_curated_v5
  preprocessing:
    surface_label: runtime_default
  training:
    surface_label: prior_cosine_warmup
    task_batch_size: 16
    prior_dump_batch_size: 64
    overrides:
      optimizer:
        min_lr: 1.0e-05
      runtime:
        mixed_precision: bf16
        grad_clip: 0.0
        grad_accum_steps: 4
        trace_activations: false
        activation_checkpointing: true
        eval_every: 25
        checkpoint_every: 25
        val_batches: 0
        max_steps: 2500
      schedule:
        stages:
        - name: prior_dump
          steps: 2500
          lr_max: 0.001
          lr_schedule: linear
          warmup_ratio: 0.1
  parameter_adequacy_plan:
  - Execute as an independent follow-up against the fresh compile-eager-dynamic anchor
    instead of stacking on top of `sandwich_heads=2`.
  - Carry the lower head count into TF-RD-009 only if it beats the current best medium
    result from `sandwich_heads=2`.
  execution_policy: benchmark_full
  benchmark_checkpoint_selection: all
  run_id: null
  followup_run_ids: []
  decision: null
  interpretation_status: pending
  confounders: []
  next_action: Run as order 1 in the TF-RD-024 two-row follow-up sweep, then compare
    directly against the current best medium result from `sandwich_heads=2`.
  notes: []
  dynamic_model_overrides: null
  reuse_train_artifact: null
  screen_metrics: null
  benchmark_metrics: null
  parent_delta_ref: null
