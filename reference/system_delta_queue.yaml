  - This sweep opens TF-RD-018 issue `#137` by comparing optimizer families directly
    against the completed TF-RD-020 noise-drift winner after the harder-front ladder
    removed dataset row caps.
  - Keep the settled row-first model, preprocessing surface, benchmark bundle, and
    harmonized `task_batch_size=1`, `grad_accum_steps=4`, `400`-step runtime fixed;
    only the inherited harder data surface and optimizer family are in scope here.
  - The locked anchor is benchmark registry run `sd_tf_rd_020_harder_dagzoo_ladder_v1_06_delta_data_manifest_root_tf_rd_020_shift_noise_drift_v2`
