# @package _global_

defaults:
  - _shared/compact_binary_prior
  - _self_

model:
  arch: tabfoundry_sandwich
  d_icl: 96
  input_normalization: train_zscore_clip
  many_class_base: 2
  head_hidden_dim: 128
  sandwich_latents: 48
  sandwich_layers: 8
  sandwich_heads: 8
  sandwich_ff_expansion: 2
runtime:
  output_dir: outputs/cls_benchmark_sandwich_prior
  trace_activations: false
logging:
  run_name: cls-benchmark-sandwich-prior
