[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "tab-foundry"
version = "0.16.3"
description = "Tabular foundation model that generates its own training data via dagzoo, trains on it, and predicts on new tasks"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.14,<3.15"
keywords = [
  "tabular",
  "foundation-model",
  "machine-learning",
  "synthetic-data",
  "in-context-learning",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "accelerate>=1.2",
  "graphviz>=0.20",
  "hydra-core>=1.3",
  "numpy>=2.1",
  "omegaconf>=2.3",
  "pydantic>=2.12",
  "pyarrow>=23.0",
  "PyYAML>=6.0",
  "safetensors>=0.4",
  "schedulefree>=1.4",
  "tab-realdata-hub>=0.1.5",
  "torch>=2.8",
  "torchview>=0.2.7",
  "wandb>=0.20",
]

[project.urls]
Documentation = "https://bensonlee5.github.io/tab-foundry/"
Repository = "https://github.com/bensonlee5/tab-foundry"
Changelog = "https://github.com/bensonlee5/tab-foundry/blob/main/CHANGELOG.md"

[project.optional-dependencies]
benchmark = [
  "h5py>=3.12",
  "matplotlib>=3.10",
  "openml>=0.15",
  "pandas>=2.2",
  "scikit-learn>=1.6",
]
muon = [
  "muon-optimizer>=0.1.0",
]

[project.scripts]
tab-foundry = "tab_foundry.cli:main"

[dependency-groups]
dev = [
  "deptry>=0.23",
  "grimp>=3.6",
  "h5py>=3.12",
  "hypothesis>=6.130",
  "matplotlib>=3.10",
  "mypy>=1.11",
  "muon-optimizer>=0.1.0",
  "openml>=0.15",
  "pandas>=2.2",
  "pre-commit>=3.8",
  "pytest>=8.0",
  "pytest-cov>=6.0",
  "pytest-xdist>=3.5",
  "ruff>=0.6",
  "scikit-learn>=1.6",
  "torchinfo>=1.8",
  "types-PyYAML>=6.0",
  "vulture>=2.14",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tab_foundry"]

[tool.uv]
package = true
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: long-running benchmark coverage",
  "research: research sweep contracts and research-engine tests",
  "gpu: tests that require CUDA or other accelerator-specific hardware",
  "integration: subprocess, smoke, or repo-tooling integration coverage",
]
addopts = "-n auto --maxprocesses 8"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
extend-select = ["PLR2004"]

[tool.ruff.lint.per-file-ignores]
"scripts/**/*.py" = ["PLR2004"]
"tests/**/*.py" = ["PLR2004"]
"src/tab_foundry/bench/checkpoint.py" = ["PLR2004"]
"src/tab_foundry/bench/nanotabpfn/bundle.py" = ["PLR2004"]
"src/tab_foundry/bench/nanotabpfn/metrics.py" = ["PLR2004"]
"src/tab_foundry/bench/registry/record_helpers.py" = ["PLR2004"]
"src/tab_foundry/bench/tune_metrics.py" = ["PLR2004"]
"src/tab_foundry/cli/dev.py" = ["PLR2004"]
"src/tab_foundry/cli/groups/data.py" = ["PLR2004"]
"src/tab_foundry/data/dataset.py" = ["PLR2004"]
"src/tab_foundry/model/architectures/tabfoundry_staged/forward_common.py" = ["PLR2004"]
"src/tab_foundry/model/architectures/tabfoundry_staged/many_class.py" = ["PLR2004"]
"src/tab_foundry/model/components/many_class.py" = ["PLR2004"]
"src/tab_foundry/model/inspection.py" = ["PLR2004"]
"src/tab_foundry/preprocessing/tabular.py" = ["PLR2004"]
"src/tab_foundry/research/sweep/curve_reuse.py" = ["PLR2004"]
"src/tab_foundry/research/sweep/matrix.py" = ["PLR2004"]
"src/tab_foundry/research/sweep/screening.py" = ["PLR2004"]
"src/tab_foundry/task_batching.py" = ["PLR2004"]
"src/tab_foundry/training/optimizer.py" = ["PLR2004"]
"src/tab_foundry/training/prior/config.py" = ["PLR2004"]
"src/tab_foundry/training/prior_dump.py" = ["PLR2004"]
"src/tab_foundry/training/wandb.py" = ["PLR2004"]

[tool.coverage.run]
source = ["tab_foundry"]
omit = [
  "src/tab_foundry/cli/*",
]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.mypy]
python_version = "3.14"
warn_unused_configs = true
ignore_missing_imports = true
strict_equality = true

[tool.deptry]
extend_exclude = ["scripts/audit"]
known_first_party = ["tab_foundry"]
package_module_name_map = { "muon-optimizer" = ["muon"], "scikit-learn" = ["sklearn"] }
per_rule_ignores = { DEP001 = ["model", "train"] }
