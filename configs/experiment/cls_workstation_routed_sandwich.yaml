# @package _global_

defaults:
  - cls_benchmark_sandwich_classification_evolution_tf_rd_009_muon_medium_v1
  - _self_

model:
  arch: routed_sandwich
  d_icl: 144
  head_hidden_dim: 96
  sandwich_layers: 4
  sandwich_heads: 1
  sandwich_summary_tokens_per_axis: null
  routed_residual_mode: dynamic_hyper
  routed_residual_streams: 2
  routed_residual_scale: deepnorm
  routed_row_summary_tokens: 4
  routed_column_summary_tokens: 2
  routed_evidence_tokens: 16
  routed_direct_cell_bypass: false

runtime:
  output_dir: outputs/cls_workstation_routed_sandwich
  max_steps: 5000

schedule:
  stages:
    - name: prior_dump
      steps: 5000
      lr_max: 1.0e-3
      lr_schedule: linear
      warmup_ratio: 0.10

logging:
  run_name: cls-workstation-routed-sandwich
  history_jsonl_path: ${runtime.output_dir}/train_history.jsonl
